name: Continuous integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Gradle build
      run: ./gradlew build --no-daemon -PGITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} -PGITHUB_USER=${{ github.actor }}

    - uses: actions/upload-artifact@v7
      with:
        name: da-opentelemetry-javaagent.jar
        path: extension/build/libs/da-opentelemetry-javaagent.jar
        if-no-files-found: error

    - uses: actions/upload-artifact@v7
      with:
        name: service.jar
        path: service/build/libs/service.jar
        if-no-files-found: error

    - uses: actions/upload-artifact@v7
      with:
        name: frontend.jar
        path: frontend/build/libs/frontend.jar
        if-no-files-found: error

  dependency-submission:
    name: Submit dependency graph
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/dependency-submission@v6
