plugins {
	id 'eclipse'
}

version = providers.gradleProperty('releaseVersion').getOrElse('development')

subprojects {
  version = rootProject.version

  // Patch Commons Lang pulled in by the Spring Boot Gradle plugin (CVE-2025-48924).
  buildscript.configurations.classpath.resolutionStrategy.force(
    "org.apache.commons:commons-lang3:${libs.versions.commons.lang3.get()}"
  )

  // Keep Jackson annotations aligned with Jackson 3 and use patched releases.
  ext['jackson-2-bom.version'] = '2.23.0'
  ext['junit-jupiter.version'] = libs.versions.junit.jupiter.get()
  ext['jackson-bom.version'] = libs.versions.jackson.get()
  ext['log4j2.version'] = '2.26.1'
  ext['thymeleaf.version'] = '3.1.7.RELEASE'

  dependencyLocking {
    lockAllConfigurations()
  }
}

task upgradeDependencies(type: Exec) {
  List<Object> commandPartsList = new ArrayList<>()
  commandPartsList.add("./gradlew")
  getRootProject().getSubprojects().stream()
    .map(Project::getName)
    .forEach(projectName -> {
      commandPartsList.add(String.format("%s:dependencies", projectName))
      commandPartsList.add("--write-locks")
  })
  Object[] commandParts = commandPartsList.toArray(new Object[commandPartsList.size()])
  commandLine commandParts
}
